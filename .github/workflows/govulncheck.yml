name: govulncheck

# Уязвимости в зависимостях публикуются постоянно: код, чистый на момент слияния,
# может стать уязвимым без единого коммита. Еженедельная проверка main ловит такие
# случаи; GitHub уведомляет о неудачном запуске.
on:
  schedule:
    - cron: "0 6 * * 1" # понедельник, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
