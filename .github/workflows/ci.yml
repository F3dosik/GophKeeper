name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# В PR новый push отменяет прежний запуск. На main и тегах — нет: каждый коммит должен
# получить свой образ sha-<коммит>, иначе make docker-up на нём не найдёт образ.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WAILS_VERSION: v2.16.0
  NODE_VERSION: "22"

jobs:
  go:
    name: Go — vet, тесты, e2e, govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go vet
        run: |
          go vet ./...
          go vet -tags=e2e ./tests/...
      - name: Unit-тесты (-race)
        run: go test -race ./...
      - name: E2E-тесты (testcontainers, PostgreSQL)
        # Образ из зеркала: анонимные загрузки с Docker Hub на общих раннерах
        # упираются в лимит запросов (toomanyrequests).
        # Ryuk (сборщик контейнеров testcontainers) тоже скачивается с Docker Hub,
        # а в CI он не нужен: раннер одноразовый и удаляется вместе с контейнерами.
        env:
          E2E_POSTGRES_IMAGE: mirror.gcr.io/library/postgres:18-alpine
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test -tags=e2e ./tests/e2e/...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    name: Фронтенд — svelte-check и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: npm ci
      - run: npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings
      - run: npm run build

  cli:
    name: CLI — сборка для всех платформ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe для версии в бинаре
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build-client-all
      - uses: actions/upload-artifact@v7
        with:
          name: cli
          path: bin/
          if-no-files-found: error

  desktop:
    name: Десктоп — ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            platform: linux/amd64
            tags: -tags webkit2_41
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
            tags: ""
          - name: macos-universal
            os: macos-latest
            platform: darwin/universal
            tags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Системные библиотеки (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Сборка
        working-directory: desktop
        shell: bash
        run: wails build -clean -platform ${{ matrix.platform }} ${{ matrix.tags }}
      - name: Проверка релизной сборки
        # Сборка с -debug или -devtools открыла бы в релизе инспектор WebView и контекстное меню.
        shell: bash
        run: |
          bin=$(find desktop/build/bin -type f \( -name gophkeeper-desktop -o -name gophkeeper-desktop.exe \) | head -1)
          if [ "$RUNNER_OS" = macOS ]; then
            lipo "$bin" -thin arm64 -output "$RUNNER_TEMP/app" && bin="$RUNNER_TEMP/app"
          fi
          tags=,$(go version -m "$bin" | awk '$1 == "build" && $2 ~ /^-tags=/ { sub(/^-tags=/, "", $2); print $2 }'),
          echo "Теги сборки: $tags"
          [[ $tags == *,production,* ]] || { echo "::error::нет тега production"; exit 1; }
          [[ $tags != *,debug,* && $tags != *,devtools,* ]] || { echo "::error::релиз собран с debug или devtools"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: desktop/build/bin/
          if-no-files-found: error

  # Образ сервера для VPS: собирается здесь, чтобы не компилировать Go на сервере
  # (сборке нужно 700–900 МБ памяти). В PR только проверяется сборка; после тестов на push
  # образ публикуется в GHCR с тегами sha-<коммит> и main, по тегу релиза — X.Y.Z, X.Y и latest.
  # make docker-up выбирает тег по текущему коммиту, поэтому образ всегда соответствует
  # миграциям и docker-compose.yaml на сервере.
  image:
    name: Образ сервера
    needs: [go]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Имя образа
        id: name
        # Имена в GHCR — только в нижнем регистре.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gophkeeper" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.server
          # arm64 — для ARM-серверов и Raspberry Pi; Go кросс-компилирует без эмуляции.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Релиз
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [go, frontend, cli, desktop, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Упаковка
        working-directory: dist
        run: |
          mkdir release
          # CLI — отдельными файлами, десктоп — архивами (на macOS это каталог .app).
          cp cli/* release/
          for dir in desktop-*/; do
            name="${dir%/}"
            (cd "$name" && zip -qr "../release/gophkeeper-${name}-${GITHUB_REF_NAME}.zip" .)
          done
          (cd release && sha256sum * > SHA256SUMS)
          ls -la release
      - name: GitHub Release
        working-directory: dist/release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" ./* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
