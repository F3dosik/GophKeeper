edition = "2023";

package auth;

option go_package = "github.com/F3dosik/GophKeeper/proto/gen";

import "google/protobuf/timestamp.proto";

// Credentials — учётные данные пользователя, используемые при регистрации и входе.
// auth_key — ключ аутентификации: HKDF(masterKey, "auth"), где masterKey = Argon2id(пароль, соль).
// Он независим от ключей шифрования секретов, поэтому сервер (и тот, кто прочитает его БД)
// не может расшифровать данные. Сервер хранит SHA-256 от auth_key; ни пароль, ни masterKey
// на сервер не передаются.
message Credentials {
    // Логин пользователя.
    string login = 1;
    // Ключ аутентификации (32 байта), полученный на клиенте.
    bytes auth_key = 2;
}

// KDFParams — параметры Argon2id, с которыми из пароля выводится мастер-ключ.
message KDFParams {
    // Число проходов (1–10).
    uint32 time = 1;
    // Объём памяти в КиБ (19456–1048576).
    uint32 memory_kib = 2;
    // Степень параллелизма (1–16).
    uint32 threads = 3;
}

// CreateUserRequest — запрос регистрации нового пользователя.
message CreateUserRequest {
    // Учётные данные будущего пользователя.
    Credentials credentials = 1;
    // Случайная соль (16 байт), сгенерированная клиентом, — используется при деривации ключа.
    bytes salt = 2;
    // Параметры Argon2id, с которыми клиент вывел ключ. Обязательны.
    KDFParams kdf = 3;
    // true — пароль временный: годен ограниченное время и должен быть сменён при
    // первом входе. Разрешено только на административном порту.
    bool temporary = 4;
}

// CreateUserResponse — ответ при успешной регистрации.
message CreateUserResponse {
    // Для временного пароля — время, до которого им можно войти.
    google.protobuf.Timestamp temporary_expires_at = 1;
}

// GetSaltRequest — запрос соли пользователя по его логину.
// Клиент запрашивает соль перед Login, чтобы получить тот же auth_key, что и при регистрации.
message GetSaltRequest {
    // Логин пользователя.
    string login = 1;
}

// GetSaltResponse — ответ с солью пользователя.
message GetSaltResponse {
    // Соль, сохранённая при регистрации пользователя.
    bytes salt = 1;
    // Параметры Argon2id пользователя.
    KDFParams kdf = 2;
}

// LoginRequest — запрос на вход в систему.
message LoginRequest {
    // Учётные данные пользователя.
    Credentials credentials = 1;
}

// LoginResponse — ответ на успешный вход.
message LoginResponse {
    // JWT-токен, который клиент передаёт в метаданных последующих запросов.
    string token = 1;
    // true — пароль временный и должен быть сменён. Токен в этом случае короткоживущий
    // и разрешает только ChangePassword и Logout.
    bool password_change_required = 2;
}

// LogoutRequest — запрос на выход.
message LogoutRequest {
    // true — отозвать все токены пользователя (выйти на всех устройствах),
    // false — только токен, с которым выполнен запрос.
    bool all_sessions = 1;
}

// LogoutResponse — пустой ответ при успешном выходе.
message LogoutResponse {}

// ChangePasswordHeader — первое сообщение потока смены пароля.
message ChangePasswordHeader {
    // Ключ аутентификации от текущего пароля: подтверждает, что пароль знает владелец,
    // а не только тот, у кого есть токен.
    bytes old_auth_key = 1;
    // Новая соль (16 байт).
    bytes new_salt = 2;
    // Ключ аутентификации от нового пароля (32 байта).
    bytes new_auth_key = 3;
    // Параметры Argon2id, с которыми выведен новый ключ.
    KDFParams new_kdf = 4;
}

// ReencryptedSecret — секрет, перешифрованный ключом от нового пароля.
message ReencryptedSecret {
    // Blind index секрета, вычисленный ключом от текущего пароля.
    string old_blind_index = 1;
    // Blind index, вычисленный ключом от нового пароля.
    string new_blind_index = 2;
    // Данные, зашифрованные ключом от нового пароля.
    bytes data = 3;
    // updated_at секрета на момент чтения клиентом: если секрет изменили позже,
    // смена пароля отменяется, чтобы не затереть изменение старыми данными.
    google.protobuf.Timestamp expected_updated_at = 4;
}

// ChangePasswordRequest — сообщение потока смены пароля: сначала header,
// затем по одному secret на каждый секрет пользователя.
message ChangePasswordRequest {
    oneof part {
        ChangePasswordHeader header = 1;
        ReencryptedSecret secret = 2;
    }
}

// ChangePasswordResponse — ответ на успешную смену пароля.
message ChangePasswordResponse {
    // Новый токен. Все ранее выданные токены пользователя отозваны.
    string token = 1;
}

// Auth — сервис аутентификации и регистрации пользователей.
service Auth {
    // CreateUser регистрирует нового пользователя.
    // Ошибки: AlreadyExists — логин занят; InvalidArgument — невалидные данные;
    // PermissionDenied — регистрация на этом порту отключена.
    rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

    // GetSalt возвращает соль пользователя, сохранённую при регистрации.
    // Ошибка: NotFound — пользователь не найден.
    rpc GetSalt(GetSaltRequest) returns (GetSaltResponse);

    // Login выполняет вход и возвращает JWT-токен.
    // Ошибки: NotFound — пользователь не найден; Unauthenticated — неверные учётные данные.
    rpc Login(LoginRequest) returns (LoginResponse);

    // Logout отзывает текущий токен или все токены пользователя.
    // Требует JWT-токен в метаданных (authorization: Bearer ...).
    // Ошибка: Unauthenticated — токен отсутствует, истёк или уже отозван.
    rpc Logout(LogoutRequest) returns (LogoutResponse);

    // ChangePassword меняет пароль и перешифровывает все секреты в одной транзакции:
    // при любой ошибке ничего не меняется. Клиент передаёт header, затем все свои секреты.
    // Требует JWT-токен. После успеха все прежние токены пользователя отозваны.
    // Ошибки: Unauthenticated — неверный текущий пароль или токен;
    // Aborted — секреты изменились во время смены (нужно повторить);
    // InvalidArgument — некорректные данные.
    rpc ChangePassword(stream ChangePasswordRequest) returns (ChangePasswordResponse);
}
