services:
  db:
    image: postgres:18-alpine
    env_file:
      - .env
    ports:
      # Только с localhost: Docker обходит ufw, поэтому 0.0.0.0 открыл бы БД в сеть.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gophkeeper"]
      interval: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: migrate/migrate
    env_file:
      - .env
    volumes:
      - ./migrations:/migrations
    command: [
      "-path", "/migrations",
      "-database", "${DATABASE_URL}",
      "up"
    ]
    depends_on:
      db:
        condition: service_healthy

  migrate-down:
    image: migrate/migrate
    profiles:
      - tools
    env_file:
      - .env
    volumes:
      - ./migrations:/migrations
    command: [
      "-path", "/migrations",
      "-database", "${DATABASE_URL}",
      "down", "1"
    ]
    depends_on:
      db:
        condition: service_healthy

  gophkeeper:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-50051}:50051"
      # Административный порт (ADMIN_PORT): регистрация, в том числе с временным паролем.
      # Публикуется только на 127.0.0.1 — доступен лишь с машины сервера.
      - "127.0.0.1:${ADMIN_PORT:-50052}:${ADMIN_PORT:-50052}"
    volumes:
      # Сертификаты из `make certs`; пути внутри контейнера задаются в TLS_CERT_FILE / TLS_KEY_FILE.
      # Ключ CA хранится в ./ca и сюда не попадает.
      - ./certs:/certs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
