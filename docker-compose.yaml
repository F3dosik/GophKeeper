services:
  db:
    image: postgres:18-alpine
    env_file:
      - .env
    ports:
      # Только с localhost: Docker обходит ufw, поэтому 0.0.0.0 открыл бы БД в сеть.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gophkeeper"]
      interval: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: migrate/migrate
    env_file:
      - .env
    volumes:
      - ./migrations:/migrations
    command: [
      "-path", "/migrations",
      "-database", "${DATABASE_URL}",
      "up"
    ]
    depends_on:
      db:
        condition: service_healthy

  migrate-down:
    image: migrate/migrate
    profiles:
      - tools
    env_file:
      - .env
    volumes:
      - ./migrations:/migrations
    command: [
      "-path", "/migrations",
      "-database", "${DATABASE_URL}",
      "down", "1"
    ]
    depends_on:
      db:
        condition: service_healthy

  gophkeeper:
    # Готовый образ из GHCR, собранный CI. Тег выбирает make docker-up по текущему коммиту
    # (релиз — X.Y.Z, иначе sha-<коммит>), чтобы образ совпадал с миграциями из этого каталога.
    # Собрать из исходников: make docker-up-local (docker-compose.build.yaml).
    image: ${GOPHKEEPER_IMAGE:-ghcr.io/f3dosik/gophkeeper}:${GOPHKEEPER_TAG:-latest}
    env_file:
      - .env
    ports:
      # Сервер слушает SERVER_PORT и внутри контейнера, поэтому порт одинаковый с обеих сторон.
      - "${SERVER_PORT:-50051}:${SERVER_PORT:-50051}"
      # Административный порт (ADMIN_PORT): регистрация, в том числе с временным паролем.
      # Публикуется только на 127.0.0.1 — доступен лишь с машины сервера.
      - "127.0.0.1:${ADMIN_PORT:-50052}:${ADMIN_PORT:-50052}"
    volumes:
      # Сертификаты из `make certs`; пути внутри контейнера задаются в TLS_CERT_FILE / TLS_KEY_FILE.
      # Ключ CA хранится в ./ca и сюда не попадает.
      - ./certs:/certs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Периодическое резервное копирование: pg_dump в ./backups с ротацией (scripts/backup.sh).
  # Интервал и число копий — BACKUP_INTERVAL и BACKUP_KEEP в .env.
  backup:
    image: postgres:18-alpine
    env_file:
      - .env
    # Файлы копий принадлежат пользователю, запустившему make docker-up (см. Makefile),
    # чтобы их можно было копировать без sudo.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
